<script>(()=>{const d=document.documentElement,K="lectures:theme";try{d.dataset.theme=localStorage.getItem(K)||"light"}catch(e){d.dataset.theme="light"}window.toggleTheme=()=>{const t=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=t;try{localStorage.setItem(K,t)}catch(e){}};document.addEventListener("click",e=>{const b=e.target.closest(".themebtn");if(b){b.blur();toggleTheme()}});addEventListener("storage",e=>{if(e.key===K)d.dataset.theme=e.newValue||"light"})})()</script><style>/* კონსპექტის / ლექტორის / მთავარი გვერდის საერთო ფერები — light და dark */
:root{
  --surf:#fdfcf9; --soft:#f6f1e8; --soft2:#ebe5d8;
  --acc-line:#ddd2fb; --ok-soft:#f3fbf5; --ok-line:#cfe9d6; --ok-ink:#166534;
  --bad-soft:#fef2f2; --bad-line:#fca5a5; --bad-ink:#991b1b;
  --warn-soft:#fff8eb; --warn-line:#f6dfb5; --warn-ink:#7c3d06;
  --info-soft:#eef5ff; --info-line:#cfe0fb; --teal-soft:#e6f6f4; --teal-line:#bfe7e2;
  --code-ink:#5b21b6; --yellow:#a16207; --deep:#1e2132; --deep2:#2a2e45; --on:#fff;
}
html[data-theme=dark]{
  color-scheme:dark;
  --bg:#16181d; --card:#1e2128; --ink:#e6e2da; --ink2:#bebab1; --muted:#8a8e98; --line:#2d313b; --line2:#3c414d;
  --accent:#ab9ff2; --accent-soft:#272439; --teal:#72bfb3; --green:#8fc8a1; --amber:#dfa96e; --red:#e68b8b; --blue:#8aa9e6;
  --g-prep:#8aa9e6; --g-flow:#ab9ff2; --g-after:#72bfb3; --g-mat:#8a93a6; --g-ready:#8fc8a1;
  --surf:#1b1e24; --soft:#252932; --soft2:#2b2f39;
  --acc-line:#433b66; --ok-soft:#1d2a23; --ok-line:#33503d; --ok-ink:#b2dcbf;
  --bad-soft:#2c2025; --bad-line:#5a3540; --bad-ink:#f0b4b4;
  --warn-soft:#2b2720; --warn-line:#574a2e; --warn-ink:#ecc78f;
  --info-soft:#1f2635; --info-line:#35466a; --teal-soft:#1b2b2a; --teal-line:#2f4f4a;
  --code-ink:#cfc6ff; --yellow:#d8c27e; --deep:#252a36; --deep2:#2c3240; --on:#16181d;
}
html[data-theme=dark] .code .k,html[data-theme=dark] .code .kd,html[data-theme=dark] .code .kn,html[data-theme=dark] .code .kr,html[data-theme=dark] .code .kc,html[data-theme=dark] .code .na{color:#c4a7f0}
html[data-theme=dark] .code .kt,html[data-theme=dark] .code .nf,html[data-theme=dark] .code .fm{color:#8fb3ec}
html[data-theme=dark] .code .s,html[data-theme=dark] .code .s1,html[data-theme=dark] .code .s2,html[data-theme=dark] .code .sa,html[data-theme=dark] .code .se,html[data-theme=dark] .code .si,html[data-theme=dark] .code .sd{color:#a9d39a}
html[data-theme=dark] .code .c,html[data-theme=dark] .code .c1,html[data-theme=dark] .code .cm,html[data-theme=dark] .code .cp,html[data-theme=dark] .code .ch{color:#727784}
html[data-theme=dark] .code .m,html[data-theme=dark] .code .mi,html[data-theme=dark] .code .mf,html[data-theme=dark] .code .mh{color:#e3a77c}

.themebtn .d{display:none}html[data-theme=dark] .themebtn .l{display:none}html[data-theme=dark] .themebtn .d{display:inline}

<style>
html[data-theme=dark]{--k1:#ab9ff2;--k2:#72bfb3;--k3:#8aa9e6;--k4:#dfa96e;--k5:#e29bba}
:root{--bg:#fbf8f3;--card:#fff;--ink:#1e2132;--muted:#7b8096;--line:#e6dfd2;--line2:#d6ccbb;--k1:#6d28d9;--k2:#0d9488;--k3:#2563eb;--k4:#d97706;--k5:#db2777;--accent:#6d28d9;--accent-soft:#f3effe;--teal:#0d9488;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Noto Sans Georgian",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
main{max-width:1120px;margin:0 auto;padding:40px 16px 80px}
header{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:34px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:6px;font-size:15px}
.search{position:relative;flex:0 1 340px;min-width:220px}
.search input{width:100%;font:16px var(--sans);padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--bg)}
.last{display:none;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--acc-line);border-radius:14px;padding:12px 16px;margin-bottom:28px;color:var(--ink);text-decoration:none}
.last.on{display:flex}
.last .lbl{font:700 12px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.last .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.last .go{margin-left:auto;font:700 14px var(--mono);color:var(--accent);white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font:700 15px var(--sans);padding:9px 16px;border-radius:10px;color:var(--muted)}
.tab:hover{color:var(--ink);background:var(--bg)}
.tab.on{background:var(--c,var(--accent));color:var(--on)}
.tab .n{font:600 12px var(--mono);padding:1px 7px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent)}
.tab.none{opacity:.55}
.course{margin:0 0 46px}
.course>h2{display:flex;align-items:center;gap:12px;font-size:28px;margin:0 0 18px;font-weight:800}
.course>h2::before{content:"";width:6px;height:28px;border-radius:3px;background:var(--c)}
.course>h2 .syl{margin-left:auto;font:700 14px var(--sans,system-ui);text-decoration:none;color:var(--ink);border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:6px 12px}
.course>h2 .syl:hover{border-color:var(--c)}
.course>h2 small{font:500 13px var(--mono);color:var(--muted)}
.course .soon{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 0;overflow:hidden;
  transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:0 1px 2px rgba(30,33,50,.04)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c,var(--accent))}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px -12px color-mix(in srgb,var(--c,var(--accent)) 35%,transparent);border-color:color-mix(in srgb,var(--c,var(--accent)) 40%,var(--line))}
.card .head{display:flex;align-items:center;gap:12px}
.card .no{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:13px;font:700 19px var(--mono);
  color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 11%,var(--card));border:1px solid color-mix(in srgb,var(--c,var(--accent)) 22%,var(--card))}
.card .kick{display:flex;flex-direction:column;line-height:1.25}
.card .kick b{font-size:13px;font-weight:700;color:var(--c,var(--accent));letter-spacing:.02em}
.card .kick span{font-size:13px;color:var(--muted)}
.title{font-weight:800;font-size:19px;line-height:1.32;color:var(--ink);text-decoration:none;flex:1;letter-spacing:-.005em}
.title::after{content:"";position:absolute;inset:0;border-radius:18px}
.card:hover .title{color:var(--c,var(--accent))}
.chips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 13px var(--sans);color:var(--ink);text-decoration:none;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.chip:hover{border-color:var(--c,var(--accent));color:var(--c,var(--accent))}
.chip i{font-style:normal;font:700 12px var(--mono);color:var(--muted)}
.meta{position:relative;z-index:1;font:600 13px var(--sans)}
.meta summary{cursor:pointer;color:var(--teal);list-style:none}.meta summary::-webkit-details-marker{display:none}
.meta details a{display:inline-block;margin:6px 10px 0 0;color:var(--teal);text-decoration:none}.meta details a:hover{text-decoration:underline}
.acts{position:relative;z-index:1;display:flex;gap:8px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 14px var(--sans);text-decoration:none;border-radius:11px;padding:10px 12px;white-space:nowrap;border:1px solid var(--line2);color:var(--ink);background:var(--card);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.play{flex:1.5;background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--c,var(--accent)) 60%,transparent)}
.btn.play:hover{filter:brightness(.93)}
.foot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px -20px 0;padding:11px 20px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 60%,var(--card))}
.foot a,.foot button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:600 13px var(--sans);color:var(--muted);padding:4px 8px;margin:-4px -8px;border-radius:8px}
.foot a:hover,.foot button:hover{color:var(--ink);background:var(--card)}
.foot button:disabled{cursor:progress;opacity:.7}
.foot .sp{flex:1}
.empty{display:none;color:var(--muted);text-align:center;padding:40px 0}
.hidden{display:none!important}
footer{color:var(--muted);font-size:14px;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
footer kbd{font:500 12px var(--mono);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--card)}
@media (max-width:640px){
  h1{font-size:28px}.search{flex-basis:100%}
}
</style></head>
<body><main>
<header>
  <div><h1>ლექციები <button class="themebtn" type="button" title="ღია / მუქი თემა" style="vertical-align:middle;font-size:16px"><span class="l">🌙</span><span class="d">☀️</span></button></h1><div class="sub" id="sub"></div></div>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ძებნა — თემა, კურსი…" autocomplete="off"><kbd>/</kbd></label>
</header>
<a class="last" id="last"><span class="lbl">ბოლოს გახსნილი</span><span class="t"></span><span class="go">გაგრძელება →</span></a>
<nav class="tabs" id="tabs"></nav>
<div id="courses"></div>
<div class="empty" id="empty">ვერაფერი მოიძებნა</div>
<footer>პრეზენტაციაში: <kbd>F</kbd> სრული ეკრანი · <kbd>←</kbd> <kbd>→</kbd> ნავიგაცია · <kbd>P</kbd> კონსპექტი სლაიდებთან ერთად · <kbd>O</kbd> ყველა სლაიდი</footer>
</main>
<script>
const CATALOG = [{"slug": "ai", "title": "AI აგენტები .NET-ში", "order": 1, "lectures": [{"num": 1, "slug": "01-genai-llm-intro", "title": "შესავალი Generative AI-სა და LLM API-ებში", "slides": 34, "materials": [], "study": true, "classwork": true, "homework": true, "quiz": 12, "lecturer": true, "study_en": true, "deck_en": true}, {"num": 2, "slug": "02-prompt-engineering", "title": "პირველი გამოძახება და Prompt Engineering", "slides": 24, "materials": [], "study": true, "classwork": true, "homework": true, "quiz": 11, "lecturer": true, "study_en": true, "deck_en": true}, {"num": 3, "slug": "03-meai-structured-output", "title": "Microsoft.Extensions.AI: DI და Structured Output", "slides": 21, "materials": [], "study": true, "classwork": true, "homework": true, "quiz": 11, "lecturer": true, "study_en": true, "deck_en": true}, {"num": 4, "slug": "04-tools-function-calling", "title": "Tools და Function Calling", "slides": 22, "materials": [], "study": true, "classwork": true, "homework": true, "quiz": 11, "lecturer": true, "study_en": true, "deck_en": true}, {"num": 5, "slug": "05-pipeline-middleware", "title": "Chat Client Pipeline და Middleware", "slides": 20, "materials": [], "study": true, "classwork": true, "homework": true, "quiz": 11, "lecturer": true, "study_en": true, "deck_en": true}, {"num": 6, "slug": "06-streaming", "title": "Streaming და Real-time AI პასუხები", "slides": 19, "materials": [], "study": true, "classwork": true, "homework": true, "quiz": 11, "lecturer": true, "study_en": true, "deck_en": true}], "syllabus": true}];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const total = CATALOG.reduce((n, c) => n + c.lectures.length, 0);
document.getElementById('sub').textContent = `${total} ლექცია`;

const COLORS = ['var(--k1)', 'var(--k2)', 'var(--k3)', 'var(--k4)', 'var(--k5)'];   // light/dark — page-theme-ში
const courses = CATALOG.map((c, i) => ({ ...c, color: COLORS[i % COLORS.length], count: c.lectures.length }));

const card = c => l => {
  const href = `${c.slug}/${l.slug}/`;
  const name = `${esc(c.title)} · ${l.num} — ${esc(l.title)}`;
  const mats = l.materials.length ? `<div class="meta"><details><summary>📎 მასალები · ${l.materials.length} ფაილი</summary>${l.materials.map(m => `<a href="${href}materials/${encodeURIComponent(m)}" download>${esc(m)}</a>`).join('')}</details></div>` : '';
  const files = ['index.html', l.deck_en && 'index.en.html', l.study && 'study.html', l.study_en && 'study.en.html', l.lecturer && 'lecturer.html'].filter(Boolean);
  const chips = l.study ? [l.classwork && `<a class="chip" href="${href}study.html#classwork">📝 კლასის დავალება</a>`, l.homework && `<a class="chip" href="${href}study.html#homework">🏠 საშინაო</a>`, l.quiz && `<a class="chip" href="${href}study.html#quiz">✅ ტესტი <i>${l.quiz}</i></a>`].filter(Boolean).join('') : '';
  return `<article class="card" data-text="${esc((c.title + ' ' + l.title + ' ' + l.materials.join(' ')).toLowerCase())}">
    <div class="head"><span class="no">${String(l.num).padStart(2, '0')}</span><span class="kick"><b>ლექცია ${l.num}</b><span>${l.slides} სლაიდი</span></span></div>
    <a class="title" href="${href}" data-open="${name}">${esc(l.title)}</a>
    ${mats}
    ${chips ? `<div class="chips">${chips}</div>` : ''}
    <div class="acts"><a class="btn play" href="${href}" data-open="${name}">▶ პრეზენტაცია</a>${l.study ? `<a class="btn" href="${href}study.html">📖 კონსპექტი</a>` : ``}</div>
    <div class="foot">${l.lecturer ? `<a href="${href}lecturer.html">🎓 ლექტორისთვის</a>` : '<span></span>'}<button class="dl" type="button" data-dl="${href}" data-files="${files.join(',')}" title="${files.join(', ')}">⬇ გადმოწერა · ${files.length} HTML</button></div>
  </article>`;
};
document.getElementById('courses').innerHTML = courses.map(c => `
  <section class="course" data-cat="${esc(c.slug)}" style="--c:${c.color}">
    <h2>${esc(c.title)}<small>${c.count} ლექცია</small>${c.syllabus ? `<a class="syl" href="${esc(c.slug)}/syllabus.html">📄 სილაბუსი</a>` : ``}</h2>
    ${c.count ? `<div class="grid">${c.lectures.map(card(c)).join('')}</div>` : `<div class="soon">ლექციები მალე დაემატება</div>`}
  </section>`).join('');

// category tabs — the choice lives in the URL (#devops), so a category can be linked directly
const tabs = document.getElementById('tabs');
tabs.innerHTML = [{ slug: '', title: 'ყველა', count: total, color: '' }, ...courses].map(k =>
  `<button class="tab${k.count ? '' : ' none'}" data-cat="${k.slug}" style="${k.color ? `--c:${k.color}` : ''}">${esc(k.title)}<span class="n">${k.count}</span></button>`).join('');
let cur = '';
function showCat(slug) {
  cur = courses.some(k => k.slug === slug) ? slug : '';
  tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.cat === cur));
  applyFilter();
}
tabs.addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  history.replaceState(null, '', t.dataset.cat ? '#' + t.dataset.cat : location.pathname);
  showCat(t.dataset.cat);
});

// last opened (per-browser convenience only)
const lastEl = document.getElementById('last');
try {
  const last = JSON.parse(localStorage.getItem('lectures:last') || 'null');
  if (last && last.href) { lastEl.href = last.href; lastEl.querySelector('.t').textContent = last.title; lastEl.classList.add('on'); }
} catch (e) {}
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-open]'); if (!a) return;
  try { localStorage.setItem('lectures:last', JSON.stringify({ href: a.getAttribute('href'), title: a.dataset.open })); } catch (e) {}
});

// search + category filter
const q = document.getElementById('q');
function applyFilter() {
  const words = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  let any = 0;
  document.querySelectorAll('.course').forEach(sec => {
    const inCat = !cur || sec.dataset.cat === cur;
    let n = 0;
    sec.querySelectorAll('.card').forEach(r => { const hit = words.every(w => r.dataset.text.includes(w)); r.classList.toggle('hidden', !hit); n += hit; });
    // an empty course shows its "soon" note only when its own tab is picked
    const soon = !sec.querySelector('.card') && cur === sec.dataset.cat && !words.length;
    sec.classList.toggle('hidden', !inCat || !(n || soon));
    if (inCat) any += n || soon;
  });
  document.getElementById('empty').style.display = any ? 'none' : 'block';
  lastEl.classList.toggle('hidden', !!words.length);
}
// ⬇ გადმოწერა: ლექციის ყველა გვერდი ცალკე HTML ფაილად (სახელები უცვლელია — ერთ საქაღალდეში ერთმანეთს ხსნიან)
document.addEventListener('click', async e => {
  const b = e.target.closest('button.dl'); if (!b) return;
  const label = b.textContent; b.disabled = true;
  try {
    for (const f of b.dataset.files.split(',')) {
      b.textContent = `⬇ ${f}…`;
      const r = await fetch(b.dataset.dl + f); if (!r.ok) throw new Error(f + ': ' + r.status);
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a'); a.href = url; a.download = f; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      await new Promise(res => setTimeout(res, 350));
    }
    b.textContent = '✓ გადმოწერილია';
  } catch (err) { b.textContent = '✗ ვერ გადმოიწერა'; console.error(err); }
  setTimeout(() => { b.textContent = label; b.disabled = false; }, 2500);
});
q.addEventListener('input', applyFilter);
showCat(location.hash.slice(1));
addEventListener('hashchange', () => showCat(location.hash.slice(1)));
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); }
});
