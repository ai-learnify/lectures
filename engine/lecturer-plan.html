<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎓 {{TITLE}} — ლექტორისთვის</title>
{{FONTS}}
<style>{{PAGE_THEME}}</style>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1e2132;--ink2:#3b3f54;--muted:#7b8096;--line:#e4ddcf;--line2:#d6cdbb;
  --accent:#6d28d9;--accent-soft:#f3effe;--teal:#0d9488;--green:#15803d;--amber:#b45309;--red:#b91c1c;--blue:#1d4ed8;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Noto Sans Georgian",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-padding-top:80px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .back{font:600 14px var(--mono);color:var(--muted);text-decoration:none;white-space:nowrap}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{font:500 13px var(--mono);color:var(--muted);margin-right:8px}
.btn{font:700 14px var(--sans);text-decoration:none;border-radius:10px;padding:7px 13px;white-space:nowrap;border:1px solid var(--line2);color:var(--ink);background:var(--card);cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.play{background:var(--accent);border-color:var(--accent);color:var(--on)}
.follow{display:none;align-items:center;gap:6px;font:600 13px var(--mono);color:var(--green)}.follow.on{display:flex}
.follow .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.timer{display:flex;align-items:center;gap:8px;font:700 14px var(--mono)}
.timer .plan{font-weight:500;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{font:700 13px var(--mono);border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
main{max-width:880px;margin:0 auto;padding:24px 20px 80px}
.hero .k{font:600 13px var(--mono);color:var(--muted)}
.hero h1{font-size:30px;line-height:1.25;margin:4px 0 6px}
.hero p{color:var(--ink2);margin:6px 0}
/* plan */
.plan-t{margin:18px 0 8px;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.plan-t .ph{display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.plan-t .ph b{font-size:16px}.plan-t .ph span{font:600 13px var(--mono);color:var(--muted)}
.plan-t a.row{display:grid;grid-template-columns:96px 34px 1fr auto;gap:10px;align-items:center;padding:7px 16px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.plan-t a.row:first-of-type{border-top:0}
.plan-t a.row:hover{background:var(--soft)}
.plan-t a.row.now{background:var(--accent-soft)}
.plan-t a.row.brk{color:var(--muted)}
.plan-t .t{font:600 13.5px var(--mono);color:var(--muted)}
.plan-t .n{font:700 13px var(--mono);text-align:center}
.plan-t .s{font:500 12.5px var(--mono);color:var(--muted)}
.plan-t .foot{padding:9px 16px;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink2);background:var(--soft)}
/* cards */
.card{margin:22px 0;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.card.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card>header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.card .num{flex:none;min-width:32px;height:32px;padding:0 6px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font:800 15px/32px var(--mono);text-align:center}
.card h2{flex:1;margin:0;font-size:19.5px;line-height:1.3}
.card .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.card .tm{font:600 13px var(--mono);color:var(--muted);white-space:nowrap}
.card .sl{font:700 13px var(--mono);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:2px 10px;white-space:nowrap}
.cb{padding:6px 18px 12px}
.cb>ul{padding-left:20px}.cb>ul li{margin:5px 0}
.blk{margin:10px 0;padding:8px 14px;border-radius:12px;border-left:4px solid var(--c,var(--line2));background:var(--b,var(--soft))}
.blk .bl{font:700 13.5px var(--sans);color:var(--c,var(--ink2));margin-bottom:2px}
.blk>div>p:first-child{margin-top:2px}.blk>div>p:last-child{margin-bottom:2px}
.k-ask{--c:var(--amber);--b:var(--warn-soft)}
.k-ex{--c:var(--teal);--b:var(--teal-soft)}
.k-how{--c:var(--accent);--b:var(--accent-soft)}
.k-must{--c:var(--accent);--b:var(--accent-soft)}
.k-prep{--c:var(--green);--b:var(--ok-soft)}
.k-plain{--c:var(--blue);--b:var(--info-soft)}
details.blk{--c:var(--red);--b:var(--bad-soft)}
details.blk>summary{cursor:pointer;list-style:none;font:700 13.5px var(--sans);color:var(--c)}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary::after{content:" ▸";color:var(--muted)}details.blk[open]>summary::after{content:" ▾"}
details.mat{margin:10px 0;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--surf)}
details.mat>summary{cursor:pointer;font-weight:700}
.k-prep li{list-style:none;position:relative;padding-left:30px;cursor:pointer;user-select:none}
.k-prep ul{padding-left:0}
.k-prep li::before{content:"";position:absolute;left:0;top:4px;width:18px;height:18px;border:2px solid var(--green);border-radius:5px;background:var(--card)}
.k-prep li.on{color:var(--muted);text-decoration:line-through}
.k-prep li.on::before{background:var(--green);box-shadow:inset 0 0 0 3px var(--card)}
.cb p{margin:8px 0}
/* ---------- markdown ---------- */
.cb p{margin:9px 0}
.cb ul,.cb ol{padding-left:22px;margin:8px 0}
.cb li{margin:4px 0}
.cb h3{font-size:19px;margin:20px 0 6px}.cb h4{font-size:17px;margin:18px 0 4px}
.cb :not(pre)>code{font:600 .86em var(--mono);background:var(--soft);border-radius:6px;padding:1px 6px;color:var(--code-ink)}
.cb table{border-collapse:collapse;margin:12px 0;font-size:15.5px;width:100%;display:block;overflow-x:auto}
.cb th,.cb td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.cb th{background:var(--soft)}
.codebox{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)df9}
.codebox .ch,.prompt .ph2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 14px;font:600 12.5px var(--mono);color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line)}
.copy{font:600 12px var(--mono);border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:7px;padding:3px 10px;cursor:pointer}
.copy.ok{color:var(--green);border-color:var(--green)}
pre.code{margin:0;padding:12px 0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;font:14px/1.65 var(--mono)}pre.code::-webkit-scrollbar{display:none}
pre.code .ln{display:block;padding:0 16px;white-space:pre}
{{TOKEN_CSS}}
.selfcheck{margin:14px 0;border:1px solid var(--ok-line);border-radius:12px;background:var(--ok-soft);padding:10px 16px}
.selfcheck .sh{font-weight:700;color:var(--green);margin-bottom:4px}.selfcheck .sh small{font-weight:400;color:var(--muted);font-size:13.5px;margin-left:6px}
.selfcheck details{border-top:1px solid var(--ok-line);padding:8px 0}
.selfcheck summary{cursor:pointer;font-weight:600;list-style:none;padding-left:28px;position:relative}
.selfcheck summary::-webkit-details-marker{display:none}
.selfcheck summary::before{content:"?";position:absolute;left:0;top:3px;width:19px;height:19px;border-radius:50%;background:var(--green);color:var(--on);font:700 12px/19px var(--mono);text-align:center}
.selfcheck details[open] summary::before{content:"✓"}
.selfcheck .ans{padding:6px 0 2px 28px;color:var(--ink2)}
.callout{display:flex;gap:12px;margin:14px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.callout .ci{font-size:19px;line-height:1.6}.callout>div>p:first-child{margin-top:0}.callout>div>p:last-child{margin-bottom:0}
.callout.warn{background:var(--card)8eb;border-color:var(--warn-line)}.callout.note{background:var(--info-soft);border-color:var(--info-line)}
.terms{margin:14px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 16px}
.terms dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}.terms dt{font:600 14.5px var(--mono);color:var(--accent)}.terms dd{margin:0}
.prompt{margin:14px 0;border:1px solid var(--acc-line);border-radius:12px;background:var(--accent-soft);padding:10px 14px;white-space:pre-wrap}
.prompt .ph{display:flex;justify-content:space-between;font:600 12.5px var(--mono);color:var(--accent);border:0;padding:0 0 6px}
/* ---------- readiness quiz ---------- */
.qscore{position:sticky;top:calc(var(--barsH,131px) + 8px);z-index:5;display:flex;align-items:center;gap:12px;font:700 14px var(--mono);color:var(--green);background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:12px;padding:8px 14px;margin:14px 0 6px}
.qscore .btn{margin-left:auto;padding:4px 12px;font-size:13px}
.qq{border:1px solid var(--line);border-radius:14px;background:var(--surf);padding:14px 16px;margin:12px 0}
@media (max-width:720px){.top{flex-wrap:wrap}.timer .plan{display:none}.plan-t a.row{grid-template-columns:80px 28px 1fr}.plan-t .s{display:none}.card>header{flex-wrap:wrap}}
@media print{.top{display:none}main{max-width:none;padding:0}.card{break-inside:avoid}details.blk,details.mat{display:block}body{font-size:13px}}
</style></head>
<body>
<div class="top">
  <a class="back" href="../../">← ლექციები</a>
  <div class="ttl"><small>🎓 ლექცია {{NUM}}</small>{{TITLE}}</div>
  <span class="follow" id="follow" title="პრეზენტაცია ღიაა — მიმდინარე თემა ინიშნება"><span class="dot"></span>სლაიდი <b id="fslide">–</b></span>
  <div class="timer"><span id="tclock">0:00</span><span class="plan" id="tplan"></span><button type="button" id="tbtn">▶ დაწყება</button></div>
  <button class="themebtn btn" type="button" title="ღია / მუქი თემა"><span class="l">🌙</span><span class="d">☀️</span></button>
  <button class="btn" type="button" onclick="print()" title="დაბეჭდე">🖨</button>
  <a class="btn" href="study.html" target="_blank">📖 კონსპექტი</a>
  <a class="btn play" href="index.html" target="_blank">▶ პრეზენტაცია</a>
</div>
<main>
  <header class="hero">
    <div class="k">🎓 ლექტორისთვის · {{COURSE}} · ლექცია {{NUM}}</div>
    <h1>{{TITLE}}</h1>
  </header>
  {{BODY}}
</main>
<script>
const DECK = {{DECK_TITLE_JSON}};
const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem('lect:' + DECK + ':' + k)); localStorage.setItem('lect:' + DECK + ':' + k, JSON.stringify(v)); } catch (e) { return null; } };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
// მომზადების ჩეკლისტი
const checks = $$('.k-prep li'); let ck = store('checks') || [];
checks.forEach((li, i) => { li.classList.toggle('on', ck.includes(i)); li.onclick = e => { if (e.target.closest('a')) return; ck = ck.includes(i) ? ck.filter(x => x !== i) : [...ck, i]; store('checks', ck); li.classList.toggle('on'); }; });
// კოპირება
document.addEventListener('click', e => {
  const btn = e.target.closest('.copy'); if (!btn) return;
  const box = btn.closest('.codebox, .prompt');
  const text = box.matches('.prompt') ? box.querySelector('.pb').textContent : [...box.querySelectorAll('.ln')].map(l => l.textContent).join('\n');
  navigator.clipboard.writeText(text).then(() => { btn.textContent = '✓ დაკოპირდა'; setTimeout(() => { btn.textContent = 'კოპირება'; }, 1600); });
});
// პრეზენტაციას მიჰყვება: მიმდინარე სლაიდის თემა ინიშნება
const cards = $$('.card[data-from]'), rows = $$('.plan-t a.row');
function markNow(c, scroll) {
  $$('.card').forEach(x => x.classList.toggle('now', x === c));
  rows.forEach(r => r.classList.toggle('now', c && r.getAttribute('href') === '#' + c.id));
  if (c && scroll) c.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
let bc = null, last = null; try { bc = new BroadcastChannel('deck-' + DECK); } catch (e) {}
if (bc) {
  bc.onmessage = ({ data }) => {
    if (data.t !== 'state') return;
    const n = data.i + 1; $('#follow').classList.add('on'); $('#fslide').textContent = n;
    const c = cards.find(x => n >= +x.dataset.from && n <= +x.dataset.to) || null;
    if (c !== last) { last = c; markNow(c, true); }
  };
  bc.postMessage({ t: 'hello' });
}
document.addEventListener('click', e => {   // ▶ სლაიდი: ღია პრეზენტაციას გადაიყვანს
  const c = e.target.closest('[data-go]'); if (!c || !bc || !$('#follow').classList.contains('on')) return;
  e.preventDefault(); bc.postMessage({ t: 'go', n: +c.dataset.go - 1 });
});
// ტაიმერი: სად უნდა იყო გეგმით
const timed = $$('.card[data-min]'), total = {{TOTAL}};
let t0 = store('t0');
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function tick() {
  if (!t0) { $('#tclock').textContent = '0:00'; $('#tplan').textContent = ''; $('#tbtn').textContent = '▶ დაწყება'; return; }
  const s = (Date.now() - t0) / 1000, m = s / 60;
  $('#tclock').textContent = fmt(s); $('#tbtn').textContent = '■';
  const c = timed.find(x => m >= +x.dataset.start && m < +x.dataset.start + +x.dataset.min);
  $('#tplan').textContent = c ? 'გეგმით: ' + c.querySelector('h2').textContent : (m >= total ? 'რეზერვის დრო' : '');
}
$('#tbtn').onclick = () => { t0 = t0 ? null : Date.now(); store('t0', t0); tick(); };
setInterval(tick, 1000); tick();
</script>
</body></html>
