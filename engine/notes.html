<!doctype html>
<html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>📖 {{TITLE}} — {{T_NOTES}}</title>
{{FONTS}}
<style>{{PAGE_THEME}}</style>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1e2132;--ink2:#3b3f54;--muted:#7b8096;--line:#e4ddcf;--line2:#d6cdbb;
  --accent:#6d28d9;--accent-soft:#f3effe;--teal:#0d9488;--green:#15803d;--amber:#b45309;--red:#b91c1c;--blue:#1d4ed8;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Noto Sans Georgian",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-padding-top:130px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 20px}
.bar .back{font:600 14px var(--mono);color:var(--muted);text-decoration:none;white-space:nowrap}
.bar .ttl{flex:1;min-width:0;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{font:500 13px var(--mono);color:var(--muted);margin-right:8px}
.acts{display:flex;gap:8px;align-items:center}
.btn{font:700 14px var(--sans);text-decoration:none;border-radius:11px;border:1px solid var(--line2);color:var(--ink);background:var(--card);cursor:pointer}
.acts .btn{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
.acts .btn.lang{font:700 13px var(--mono)}
.acts .btn svg{width:20px;height:20px}
.btn:hover{border-color:var(--ink2)}
.btn.play{background:var(--accent);border-color:var(--accent);color:var(--on)}
.tabs{display:flex;gap:4px;justify-content:center;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 15px var(--sans);border:0;background:transparent;color:var(--ink2);padding:7px 16px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tabs button small{font:600 12px var(--mono);color:var(--muted);margin-left:4px}
.tabs button.on{background:var(--card);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.1)}
main{max-width:860px;margin:0 auto;padding:22px 20px 80px}
.hero .k{font:600 13px var(--mono);color:var(--muted)}
.hero h1{font-size:30px;line-height:1.25;margin:4px 0 18px}
.panel{display:none}.panel.on{display:block}
.box{margin:16px 0;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px 22px}
.box>h2{font-size:19px;margin:0 0 8px}
.box.key{background:var(--deep);color:#e8e6f2;border:0}
.box.key h2{color:#fff}.box.key strong{color:#fff}.box.key code{background:rgba(255,255,255,.12)!important;color:#fff!important}
.box.key ol{margin:0;padding-left:24px}.box.key li{margin:8px 0}
.box ul,.box ol{padding-left:22px}
.path li{margin:6px 0}
.topic{margin:18px 0;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.topic>header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.topic .num{flex:none;min-width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font:800 15px/32px var(--mono);text-align:center}
.topic h2{flex:1;margin:0;font-size:19.5px;line-height:1.3}
.topic .sl{font:700 13px var(--mono);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tb{padding:4px 20px 10px}
.tb p{margin:10px 0}.tb ul,.tb ol{padding-left:22px}.tb li{margin:4px 0}
.tb :not(pre)>code,.box :not(pre)>code{font:600 .86em var(--mono);background:var(--soft);border-radius:6px;padding:1px 6px;color:var(--code-ink)}
.tb table,.box table{border-collapse:collapse;margin:12px 0;font-size:15.5px;width:100%;display:block;overflow-x:auto}
.tb th,.tb td,.box th,.box td{border:1px solid var(--line);padding:7px 12px;text-align:left;vertical-align:top}
.tb th,.box th{background:var(--soft)}
.task h3{font-size:20px;margin:4px 0 4px}.task h4{font-size:16.5px;margin:16px 0 4px}
.hint{color:var(--muted);font-size:15px;margin:4px 0 0}
.codebox{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)df9}
.codebox .ch,.prompt .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 14px;font:600 12.5px var(--mono);color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line)}
.copy{font:600 12px var(--mono);border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:7px;padding:3px 10px;cursor:pointer}
.copy.ok{color:var(--green);border-color:var(--green)}
pre.code{margin:0;padding:12px 0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;font:14px/1.65 var(--mono)}pre.code::-webkit-scrollbar{display:none}
pre.code .ln{display:block;padding:0 16px;white-space:pre}
{{TOKEN_CSS}}
.prompt{margin:16px 0;border:1px solid var(--acc-line);border-radius:12px;overflow:hidden;background:var(--accent-soft)}
.prompt .ph{background:var(--accent-soft);border-color:var(--acc-line);color:var(--accent)}
.prompt .pb{padding:12px 16px;white-space:pre-wrap;font-size:15.5px;line-height:1.6;color:var(--ink2)}
.selfcheck{margin:16px 0;border:1px solid var(--ok-line);border-radius:12px;background:var(--ok-soft);padding:12px 16px}
.selfcheck .sh{font-weight:700;color:var(--green);margin-bottom:6px}
.selfcheck .sh small{font-weight:400;color:var(--muted);font-size:13.5px;margin-left:6px}
.selfcheck details{border-top:1px solid var(--ok-line);padding:8px 0}
.selfcheck details:first-of-type{border-top:0}
.selfcheck summary{cursor:pointer;font-weight:600;list-style:none;padding-left:28px;position:relative}
.selfcheck summary::-webkit-details-marker{display:none}
.selfcheck summary::before{content:"?";position:absolute;left:0;top:3px;width:19px;height:19px;border-radius:50%;background:var(--green);color:var(--on);font:700 12px/19px var(--mono);text-align:center}
.selfcheck details[open] summary::before{content:"✓"}
.selfcheck .ans{padding:6px 0 2px 28px;color:var(--ink2)}
.terms{margin:16px 0;border:1px solid var(--line);border-radius:12px;background:var(--surf);padding:12px 16px}
.terms .th{font-weight:700;margin-bottom:6px}
.terms dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
.terms dt{font:600 14.5px var(--mono);color:var(--accent)}
.terms dd{margin:0;color:var(--ink2)}
.callout{display:flex;gap:12px;margin:14px 0;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.callout .ci{font-size:20px;line-height:1.6}
.callout>div>p:first-child{margin-top:0}.callout>div>p:last-child{margin-bottom:0}
.callout.warn{background:var(--card)8eb;border-color:var(--warn-line)}
.callout.note{background:var(--info-soft);border-color:var(--info-line)}
.callout.tip{background:var(--accent-soft);border-color:var(--acc-line)}
/* ---------- quiz ---------- */
.qscore{position:sticky;top:66px;z-index:5;display:flex;align-items:center;gap:12px;font:700 14px var(--mono);color:var(--accent);background:var(--accent-soft);border:1px solid var(--acc-line);border-radius:12px;padding:8px 14px;margin:14px 0 6px}
.qscore .btn{margin-left:auto;padding:4px 12px;font-size:13px}
.qq{border:1px solid var(--line);border-radius:14px;background:var(--surf);padding:14px 16px;margin:12px 0}
.qt{font-weight:700;display:flex;gap:10px}
.qn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 13px/26px var(--mono);text-align:center}
.opts{display:grid;gap:8px;margin:10px 0 4px 36px}
.opt{text-align:left;font:15.5px/1.5 var(--sans);color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad-ink)}
.qe{display:none;margin:8px 0 0 36px;padding:8px 12px;border-radius:10px;background:var(--soft);font-size:15.5px;color:var(--ink2)}
.qq.done .qe{display:block}
.qq.ok .verdict::before{content:"✓ სწორია.";color:var(--green);font-weight:700}
.qq.no .verdict::before{content:"✗ არა.";color:var(--red);font-weight:700}
.qsum{display:none;margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--ok-line);background:var(--ok-soft)}
.qsum.on{display:block}
.chip{font:600 12px var(--mono);color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-left:6px}
.qscore{top:120px}
@media (max-width:720px){.bar .ttl small{display:none}.tabs{justify-content:flex-start}.topic>header{flex-wrap:wrap}.terms dl{grid-template-columns:1fr}}
@media print{.top{display:none}.panel{display:block!important}.selfcheck details{display:block}}
</style></head>
<body>
<div class="top">
  <div class="bar">
    <a class="back" href="../../">{{T_BACK}}</a>
    <div class="ttl"><small>📖 {{T_LECTURE}} {{NUM}}</small>{{TITLE}}</div>
    <div class="acts">
      {{LANGBTN}}
      <button class="themebtn btn" type="button" title="{{T_THEME}}" aria-label="{{T_THEME}}"><span class="l">🌙</span><span class="d">☀️</span></button>
      <a class="btn play" href="{{DECK}}" target="_blank" title="{{T_DECK}}" aria-label="{{T_DECK}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h20"/><path d="M3 3v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V3"/><path d="m7 21 5-5 5 5"/><path d="M10 7.5v5l4-2.5z" fill="currentColor"/></svg></a>
    </div>
  </div>
  <nav class="tabs" role="tablist">{{TABS}}</nav>
</div>
<main>
  <header class="hero"><div class="k">📖 {{COURSE}} · {{T_LECTURE}} {{NUM}}</div><h1>{{TITLE}}</h1></header>
  {{PANELS}}
</main>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const T = {{I18N}};
// tabs: #topics, #tasks, #quiz — the hash keeps the tab
function show(id, scroll) {
  if (!document.getElementById('tab-' + id)) id = 'main';
  $$('.panel').forEach(p => p.classList.toggle('on', p.id === 'tab-' + id));
  $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === id));
  if (scroll) scrollTo({ top: 0 });
}
$$('.tabs button').forEach(b => b.onclick = () => { history.replaceState(null, '', '#' + b.dataset.t); show(b.dataset.t, true); });
document.addEventListener('click', e => {   // in-page links to a tab: <a href="#quiz">
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const id = a.getAttribute('href').slice(1); if (!document.getElementById('tab-' + id)) return;
  e.preventDefault(); history.replaceState(null, '', '#' + id); show(id, true);
});
show(location.hash.slice(1) || 'main');
// copy
document.addEventListener('click', e => {
  const btn = e.target.closest('.copy'); if (!btn) return;
  const box = btn.closest('.codebox, .prompt');
  const text = box.matches('.prompt') ? box.querySelector('.pb').textContent : [...box.querySelectorAll('.ln')].map(l => l.textContent).join('\n');
  navigator.clipboard.writeText(text).then(() => { btn.textContent = T.copied; setTimeout(() => { btn.textContent = T.copy; }, 1600); });
});
// quiz
const quiz = $$('.qq');
function qUpdate() {
  const done = quiz.filter(q => q.classList.contains('done')), good = done.filter(q => q.classList.contains('ok'));
  if (!$('#qs')) return;
  $('#qs').textContent = good.length; $('#qd').textContent = done.length;
  const sum = $('#qsum');
  if (done.length === quiz.length) {
    const bad = quiz.filter(q => q.classList.contains('no'));
    sum.innerHTML = `<b>${good.length} / ${quiz.length}</b> — ` + (bad.length ? T.review + bad.map(q => q.querySelector('.qn').textContent).join(', ') + '.' : T.allright);
    sum.classList.add('on');
  } else sum.classList.remove('on');
}
document.addEventListener('click', e => {
  const o = e.target.closest('.opt'); if (o) {
    const q = o.closest('.qq'); if (q.classList.contains('done')) return;
    const right = +q.dataset.answer;
    q.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (i === right) b.classList.add('right'); });
    if (+o.dataset.i !== right) o.classList.add('wrong');
    q.classList.add('done', +o.dataset.i === right ? 'ok' : 'no'); qUpdate(); return;
  }
  if (e.target.closest('.qreset')) {
    quiz.forEach(q => { q.classList.remove('done', 'ok', 'no'); q.querySelectorAll('.opt').forEach(b => { b.disabled = false; b.classList.remove('right', 'wrong'); }); });
    qUpdate(); scrollTo({ top: 0 });
  }
});
// KA ⇄ EN keeps the tab
$('.lang')?.addEventListener('click', e => { e.currentTarget.href += location.hash; });
</script>
</body></html>
